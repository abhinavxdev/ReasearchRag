[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchrag"
version = "0.1.0"
description = "Local-first, citation-checked research paper assistant"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30", "pydantic>=2.9,<3", "pydantic-settings>=2.5",
 "python-multipart>=0.0.18", "sqlalchemy>=2.0,<3", "pymupdf>=1.24", "pypdf>=5",
 "sentence-transformers>=3,<6", "chromadb>=0.6,<2", "rank-bm25>=0.2.2", "httpx>=0.27",
 "streamlit>=1.40", "tenacity>=9", "numpy>=1.26"
]
[project.optional-dependencies]
dev = ["ruff>=0.9", "mypy>=1.14", "pytest>=8", "pytest-asyncio>=0.25", "pre-commit>=4"]
[tool.hatch.build.targets.wheel]
packages = ["src/researchrag"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = [".venv"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
